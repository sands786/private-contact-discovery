[package]
name = "contact-discovery"
version = "0.1.0"
description = "Private Contact Discovery using Arcium MXE on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "contact_discovery"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
arcium-sdk = { git = "https://github.com/arcium-hq/arcium-sdk", branch = "main" }
sha2 = "0.10.8"
hex = "0.4.3"
